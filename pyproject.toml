[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "synapse-knowledge"
version = "0.1.0"
description = "Local-first MCP service for code knowledge graphs, project context and persistent project memory"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "typer>=0.12",
  "rich>=13",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-python>=0.25,<0.26",
  "markdown-it-py>=3,<5",
  "mdit-py-plugins>=0.4,<0.6",
  "pathspec>=0.12",
  "platformdirs>=4",
  "filelock>=3.13",
  "mcp>=2.3,<2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27,<1",
]
gui = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
synapse = "synapse.integrations.cli.main:app"
synapse-mcp = "synapse.integrations.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/synapse/integrations/cli/main.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["synapse"]
check_untyped_defs = true
warn_unused_ignores = true
